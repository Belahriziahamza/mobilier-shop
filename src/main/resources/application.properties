# =========================================================
# APPLICATION
# =========================================================

spring.application.name=mobilier-shop

server.port=8080


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mobilier_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=false

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html


# =========================================================
# UPLOAD IMAGES
# =========================================================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=12MB


# =========================================================
# ADMIN SECURITY
# =========================================================

spring.security.user.name=${ADMIN_USERNAME:root}

spring.security.user.password=${ADMIN_PASSWORD:}

spring.security.user.roles=ADMIN


# =========================================================
# EMAIL - ZINEB DECO
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# URL APPLICATION
# =========================================================

app.base-url=${APP_BASE_URL:http://localhost:8080}


# =========================================================
# GOOGLE OAUTH2 - ZINEB DECO
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.security.oauth2.client.registration.google.scope=openid,profile,email