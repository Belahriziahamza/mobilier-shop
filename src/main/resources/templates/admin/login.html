<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Administration | Zineb Déco
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}"
          href="/css/style.css">

</head>


<body class="admin-login-body">


<main class="admin-login-page">


    <section class="admin-login-card">


        <!-- LOGO -->

        <a th:href="@{/}"
           href="/"
           class="admin-login-logo">

            <img th:src="@{/images/logo-zineb-deco.png}"
                 src="/images/logo-zineb-deco.png"
                 alt="Zineb Déco">

        </a>



        <!-- TITRE -->

        <span class="section-label dark">

            ADMINISTRATION

        </span>


        <h1>

            Espace Admin

        </h1>


        <p class="admin-login-description">

            Connectez-vous pour gérer les produits,
            les commandes, les clients
            et l'administration de Zineb Déco.

        </p>



        <!-- LOGIN INCORRECT -->

        <div th:if="${param.error}"
             class="admin-alert error"
             style="margin-top:20px;">

            Identifiant ou mot de passe incorrect.

        </div>



        <!-- LOGOUT -->

        <div th:if="${param.logout}"
             class="admin-alert success"
             style="margin-top:20px;">

            Vous êtes maintenant déconnecté.

        </div>



        <!-- FORMULAIRE -->

        <form th:action="@{/admin/login}"
              action="/admin/login"
              method="post"
              class="admin-login-form">


            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">



            <!-- USERNAME -->

            <div>


                <label for="username">

                    Identifiant administrateur

                </label>


                <input id="username"
                       name="username"
                       type="text"
                       placeholder="Votre identifiant"
                       autocomplete="username"
                       required
                       autofocus>


            </div>



            <!-- PASSWORD -->

            <div>


                <label for="password">

                    Mot de passe

                </label>


                <input id="password"
                       name="password"
                       type="password"
                       placeholder="Votre mot de passe"
                       autocomplete="current-password"
                       required>


            </div>



            <!-- SUBMIT -->

            <button type="submit">

                Se connecter à l'administration

            </button>


        </form>



        <!-- RETOUR -->

        <div style="
            margin-top:22px;
            padding-top:17px;
            border-top:1px solid #ece6dd;
        ">


            <a th:href="@{/}"
               href="/"
               style="
                    color:#a77a20;
                    font-size:9px;
                    font-weight:800;
                    text-decoration:none;
               ">

                ← Retour à la boutique

            </a>


        </div>


    </section>


</main>


</body>

</html>
