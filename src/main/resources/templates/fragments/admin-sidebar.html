<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<body>


<!-- =========================================================
     SIDEBAR ADMIN
========================================================= -->

<aside th:fragment="sidebar(activePage)"
       class="zdadm-sidebar">


    <!-- =====================================================
         LOGO / IDENTITE
    ====================================================== -->

    <div class="zdadm-sidebar-brand">


        <a th:href="@{/admin}"
           href="/admin"
           class="zdadm-sidebar-logo">


            <img th:src="@{/images/logo-zineb-deco.png}"
                 src="/images/logo-zineb-deco.png"
                 alt="Zineb Déco">


        </a>


        <div class="zdadm-sidebar-brand-text">


            <strong>
                Zineb Déco
            </strong>


            <span>
                Administration
            </span>


        </div>


    </div>



    <!-- =====================================================
         APPARENCE
    ====================================================== -->

    <div class="zdadm-theme-box">


        <span class="zdadm-theme-label">
            APPARENCE
        </span>


        <button type="button"
                class="admin-theme-toggle"
                data-admin-theme-toggle
                aria-label="Changer le thème">


            <span class="admin-theme-icon">
                ☾
            </span>


            <span class="admin-theme-text">
                Mode sombre
            </span>


        </button>


    </div>



    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="zdadm-nav">


        <!-- =================================================
             TABLEAU DE BORD
        ================================================== -->

        <a th:href="@{/admin}"
           href="/admin"

           th:classappend="${activePage == 'dashboard'}
                ? 'active'
                : ''">

            Tableau de bord

        </a>



        <!-- =================================================
             PRODUITS
        ================================================== -->

        <a th:href="@{/admin/produits}"
           href="/admin/produits"

           th:classappend="${activePage == 'produits'}
                ? 'active'
                : ''">

            Produits

        </a>



        <!-- =================================================
             PIECES
        ================================================== -->

        <a th:href="@{/admin/pieces}"
           href="/admin/pieces"

           th:classappend="${activePage == 'pieces'}
                ? 'active'
                : ''">

            Pièces

        </a>



        <!-- =================================================
             COMMANDES
        ================================================== -->

        <a th:href="@{/admin/commandes}"
           href="/admin/commandes"

           th:classappend="${activePage == 'commandes'}
                ? 'active'
                : ''">

            Commandes

        </a>



        <!-- =================================================
             CLIENTS
        ================================================== -->

        <a th:href="@{/admin/clients}"
           href="/admin/clients"

           th:classappend="${activePage == 'clients'}
                ? 'active'
                : ''">

            Clients

        </a>



        <!-- =================================================
             TISSUS & COULEURS
        ================================================== -->

        <a th:href="@{/admin/tissus-couleurs}"
           href="/admin/tissus-couleurs"

           th:classappend="${activePage == 'tissus-couleurs'}
                ? 'active'
                : ''">

            Tissus & Couleurs

        </a>



        <!-- =================================================
             PARAMETRES
        ================================================== -->

        <a th:href="@{/admin/parametres}"
           href="/admin/parametres"

           th:classappend="${activePage == 'parametres'}
                ? 'active'
                : ''">

            Paramètres

        </a>


    </nav>



    <!-- =====================================================
         BAS SIDEBAR
    ====================================================== -->

    <div class="zdadm-sidebar-bottom">


        <!-- =================================================
             VOIR LA BOUTIQUE
        ================================================== -->

        <a th:href="@{/}"
           href="/"
           target="_blank"
           rel="noopener"
           class="zdadm-sidebar-site">

            Voir la boutique →

        </a>



        <!-- =================================================
             DECONNEXION ADMIN
        ================================================== -->

        <form th:action="@{/admin/logout}"
              action="/admin/logout"
              method="post"
              class="zdadm-sidebar-logout-form">


            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <button type="submit"
                    class="zdadm-sidebar-logout">

                Déconnexion

            </button>


        </form>


    </div>



    <!-- =====================================================
         THEME JS
    ====================================================== -->

    <script th:src="@{/js/admin-theme.js}"
            src="/js/admin-theme.js">
    </script>


</aside>


</body>

</html>
