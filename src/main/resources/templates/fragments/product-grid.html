<!DOCTYPE html>

<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<body>


<!-- =========================================================
     PRODUCT GRID - ZINEB DECO
========================================================= -->

<section th:fragment="productGrid(products)"
         class="products-section">


    <!-- =====================================================
         AUCUN PRODUIT
    ====================================================== -->

    <div class="catalog-empty"
         th:if="${products == null or #lists.isEmpty(products)}">


        <div class="catalog-empty-icon">
            ZD
        </div>


        <h2>
            Aucun produit disponible
        </h2>


        <p>
            De nouveaux modèles seront bientôt disponibles.
        </p>


        <a th:href="@{/}"
           href="/"
           class="btn btn-gold">

            Retour à l'accueil

        </a>


    </div>



    <!-- =====================================================
         GRILLE PRODUITS
    ====================================================== -->

    <div class="product-grid"
         th:if="${products != null and !#lists.isEmpty(products)}">


        <article class="product-card"
                 th:each="product : ${products}"
                 th:attr="data-product-id=${product.id}">


            <!-- =============================================
                 IMAGE
            ============================================== -->

            <div class="product-card-image">


                <a th:href="@{/produit/{id}(id=${product.id})}"
                   href="#"
                   class="product-image-link">


                    <img th:if="${product.imagePath != null
                                and !#strings.isEmpty(product.imagePath)}"

                         th:src="${product.imagePath}"

                         th:alt="${product.name}"

                         loading="lazy">


                    <div class="product-image-placeholder"

                         th:if="${product.imagePath == null
                                or #strings.isEmpty(product.imagePath)}">


                        <span>
                            ZD
                        </span>


                        <small>
                            ZINEB DÉCO
                        </small>


                    </div>


                </a>



                <!-- =========================================
                     BADGES
                ========================================== -->

                <div class="product-badges">


                    <span class="product-badge product-badge-new"
                          th:if="${product.newProduct}">

                        Nouveau

                    </span>


                    <span class="product-badge product-badge-promo"
                          th:if="${product.promotion}">

                        Promotion

                    </span>


                </div>



                <!-- =========================================
                     FAVORIS
                ========================================== -->

                <button type="button"
                        class="mysql-favorite-button"

                        th:attr="
                            data-product-id=${product.id},
                            data-csrf-token=${_csrf.token},
                            data-csrf-header=${_csrf.headerName}"

                        aria-label="Ajouter aux favoris"
                        title="Ajouter aux favoris">

                    ♡

                </button>


            </div>



            <!-- =============================================
                 INFORMATIONS PRODUIT
            ============================================== -->

            <div class="product-card-content">


                <!-- CATEGORIE -->

                <div class="product-category"
                     th:if="${product.category != null}">


                    <span th:text="${
                        product.category == 'salon'
                            ? 'Salon'
                        : product.category == 'canape'
                            ? 'Canapé'
                        : product.category == 'chambre'
                            ? 'Chambre'
                        : product.category == 'lit'
                            ? 'Lit'
                        : product.category == 'tete-de-lit'
                            ? 'Tête de lit'
                        : product.category == 'chaise'
                            ? 'Chaise'
                        : product.category == 'fauteuil'
                            ? 'Fauteuil'
                        : product.category == 'table'
                            ? 'Table'
                        : product.category
                    }">

                        Catégorie

                    </span>


                </div>



                <!-- =========================================
                     NOM
                ========================================== -->

                <h3 class="product-card-title">


                    <a th:href="@{/produit/{id}(id=${product.id})}"
                       href="#"
                       th:text="${product.name}">

                        Produit Zineb Déco

                    </a>


                </h3>



                <!-- =========================================
                     TYPE
                ========================================== -->

                <p class="product-card-type"

                   th:if="${product.type != null
                           and !#strings.isEmpty(product.type)}"

                   th:text="${product.type}">

                    Type

                </p>



                <!-- =========================================
                     PRIX
                ========================================== -->

                <div class="product-card-prices">


                    <!-- =====================================
                         ANCIEN PRIX

                         Il apparaît dès qu'une valeur
                         oldPrice existe dans MySQL.
                    ====================================== -->

                    <span class="product-old-price"
                          th:if="${product.oldPrice != null}">


                        <span th:text="${product.oldPrice}">
                            6000.00
                        </span>

                        DH


                    </span>



                    <!-- =====================================
                         PRIX ACTUEL
                    ====================================== -->

                    <strong class="product-price">


                        <span th:text="${product.price}">
                            5000.00
                        </span>


                        <small>
                            DH
                        </small>


                    </strong>


                </div>



                <!-- =========================================
                     COULEUR
                ========================================== -->

                <div class="product-extra-info"

                     th:if="${product.color != null
                             and !#strings.isEmpty(product.color)}">


                    <span>
                        Couleur
                    </span>


                    <strong th:text="${product.color}">
                        Beige
                    </strong>


                </div>



                <!-- =========================================
                     DISPONIBILITE
                ========================================== -->

                <div class="product-availability">


                    <span class="availability-dot"

                          th:classappend="${product.active}
                              ? ' available'
                              : ' unavailable'">
                    </span>



                    <span th:if="${product.availability != null
                                 and !#strings.isEmpty(product.availability)}"

                          th:text="${product.availability}">

                        Disponible

                    </span>



                    <span th:if="${product.availability == null
                                 or #strings.isEmpty(product.availability)}"

                          th:text="${product.active
                              ? 'Disponible'
                              : 'Indisponible'}">

                        Disponible

                    </span>


                </div>



                <!-- =========================================
                     ACTIONS
                ========================================== -->

                <div class="product-card-actions">


                    <a th:href="@{/produit/{id}(id=${product.id})}"
                       href="#"
                       class="product-detail-button">

                        Voir détails

                    </a>



                    <!-- AJOUT PANIER -->

                    <button type="button"
                            class="add-cart-button"

                            th:if="${product.active}"

                            th:attr="
                                data-id=${product.id},
                                data-name=${product.name},
                                data-price=${product.price},
                                data-image=${product.imagePath != null
                                    ? product.imagePath
                                    : ''}">

                        Ajouter au panier

                    </button>



                    <!-- INDISPONIBLE -->

                    <button type="button"
                            class="add-cart-button disabled"
                            disabled
                            th:if="${!product.active}">

                        Indisponible

                    </button>


                </div>


            </div>


        </article>


    </div>


</section>


</body>

</html>
